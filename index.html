<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Auth (GitHub & Google)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f7f6;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
      transition: background-color 0.2s;
    }
    #github-login-btn {
      background-color: #24292e;
      color: white;
    }
    #github-login-btn:hover {
      background-color: #444;
    }
    #google-login-btn {
      background-color: #4285F4;
      color: white;
    }
    #google-login-btn:hover {
      background-color: #357ae8;
    }
    #logout-btn {
      background-color: #d9534f;
      color: white;
      display: none; /* Скрыта по умолчанию */
    }
    #logout-btn:hover {
      background-color: #c9302c;
    }
    #user-info {
      margin-top: 20px;
      text-align: center;
    }
    #user-info img {
      border-radius: 50%;
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
    }
    .btn-container {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>Авторизация в приложении</h1>
  
  <!-- Кнопки входа и выхода -->
  <div class="btn-container">
    <button id="github-login-btn">Войти через GitHub</button>
    <button id="google-login-btn">Войти через Google</button>
  </div>
  <button id="logout-btn">Выйти из аккаунта</button>
  
  <!-- Данные пользователя -->
  <div id="user-info"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GithubAuthProvider, 
      GoogleAuthProvider, // Добавлен импорт GoogleAuthProvider
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyDbVnDnPSOU2hSy7V_sF2f_mwXa8CwQ2gk",
      authDomain: "project-2-db609.firebaseapp.com",
      projectId: "project-2-db609",
      storageBucket: "project-2-db609.firebasestorage.app",
      messagingSenderId: "129341680436",
      appId: "1:129341680436:web:33ac69eab66851de1c9361",
      measurementId: "G-EZ0966QSWS"
    };
  
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    
    // Инициализация провайдеров
    const githubProvider = new GithubAuthProvider();
    const googleProvider = new GoogleAuthProvider(); // Инициализация Google [2.1]
  
    const githubLoginBtn = document.getElementById('github-login-btn');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfoDiv = document.getElementById('user-info');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        userInfoDiv.innerHTML = `
          <img src="${user.photoURL}" alt="Аватар">
          <h2>Привет, ${user.displayName || 'Пользователь'}!</h2>
          <p>Email: ${user.email || 'скрыт или не указан'}</p>
        `;
        githubLoginBtn.style.display = 'none';
        googleLoginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
      } else {
        userInfoDiv.innerHTML = '';
        githubLoginBtn.style.display = 'inline-block';
        googleLoginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
      }
    });

    async function loginWithGithub() {
      try {
        await signInWithPopup(auth, githubProvider);
      } catch (error) {
        console.error("Ошибка GitHub:", error.code, error.message);
        userInfoDiv.innerHTML = `<p style="color: red;">Ошибка: ${error.message}</p>`;
      }
    }

    async function loginWithGoogle() {
      try {
        await signInWithPopup(auth, googleProvider); // Вход через Google [2.1]
      } catch (error) {
        console.error("Ошибка Google:", error.code, error.message);
        userInfoDiv.innerHTML = `<p style="color: red;">Ошибка: ${error.message}</p>`;
      }
    }

    async function logout() {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Ошибка при выходе:", error.code, error.message);
      }
    }
  
    githubLoginBtn.addEventListener('click', loginWithGithub);
    googleLoginBtn.addEventListener('click', loginWithGoogle);
    logoutBtn.addEventListener('click', logout);
  </script>
</body>
</html>
